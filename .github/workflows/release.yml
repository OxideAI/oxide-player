name: Release (build & package)

on:
  push:
    tags:
      - "oxide-player-v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name to attach assets to (defaults to push tag)"
        type: string
        required: false
  workflow_call:
    inputs:
      tag_name:
        description: "Tag name to attach assets to"
        type: string
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Build & package (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Raspberry Pi 3/4/5 (64-bit OS)
          - target: aarch64-unknown-linux-gnu
            arch: arm64
          # Desktop / server (x86_64)
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compile linker (aarch64)
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-L/usr/lib/aarch64-linux-gnu" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_aarch64_unknown_linux_gnu_ALLOW_CROSS=true" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_aarch64_unknown_linux_gnu_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_SYSROOT_DIR=/" >> "$GITHUB_ENV"

      - name: Install system libraries (ALSA + D-Bus)
        run: |
          sudo apt-get update
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            # Restrict existing repos to amd64 *before* adding arm64 arch.
            # Only touch lines that don't already have an arch spec.
            sudo sed -i '/^deb /{/\[arch=/!s/^deb /deb [arch=amd64] /}' /etc/apt/sources.list 2>/dev/null || true
            for f in /etc/apt/sources.list.d/*.list; do
              [ -f "$f" ] || continue
              sudo sed -i '/^deb /{/\[arch=/!s/^deb /deb [arch=amd64] /}' "$f" 2>/dev/null || true
            done
            # Handle deb822 format (Ubuntu 24.04+, .sources files).
            for f in /etc/apt/sources.list.d/*.sources; do
              [ -f "$f" ] && sudo sed -i '/^Types: deb$/a\Architectures: amd64' "$f" 2>/dev/null || true
            done

            sudo dpkg --add-architecture arm64
            # Inject arm64 repos matching the runner's Ubuntu release.
            # shellcheck source=/etc/os-release
            . /etc/os-release
            ubuntu_codename="${VERSION_CODENAME:-noble}"
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $ubuntu_codename main" | sudo tee /etc/apt/sources.list.d/arm64-ports.list
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${ubuntu_codename}-updates main" | sudo tee -a /etc/apt/sources.list.d/arm64-ports.list
            sudo apt-get update
            sudo apt-get install -y libasound2-dev:arm64 libdbus-1-dev:arm64
            ls /usr/lib/aarch64-linux-gnu/pkgconfig/alsa.pc
          else
            sudo apt-get install -y libasound2-dev libdbus-1-dev
          fi

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: release-${{ matrix.target }}

      - name: Build backend (release, cross)
        run: |
          echo "host: $(rustc -vV | grep host)"
          echo "rustc: $(rustc --version)"
          echo "target: ${{ matrix.target }}"
          echo "cargo version: $(cargo --version)"
          cargo build --release --target ${{ matrix.target }}

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (dist/)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Assemble package
        id: pkg
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          STAGE="oxide-player-${ARCH}"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/bin" "$STAGE/dist" "$STAGE/contrib"

          # Prebuilt backend binary (consumed by install.sh's INSTALL_FROM_DIR path)
          install -Dm0755 "target/${TARGET}/release/oxide-player" "$STAGE/bin/oxide-player"
          # install.sh looks for target/release/oxide-player under INSTALL_FROM_DIR,
          # so also place it where the installer expects it.
          mkdir -p "$STAGE/target/release"
          install -Dm0755 "target/${TARGET}/release/oxide-player" "$STAGE/target/release/oxide-player"

          cp -r frontend/dist/. "$STAGE/dist/"
          cp -r contrib/. "$STAGE/contrib/"
          cp install.sh "$STAGE/install.sh"
          chmod +x "$STAGE/install.sh"

          tar -czf "${STAGE}.tar.gz" "$STAGE"
          echo "asset=${STAGE}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Verify package (toolchain-free smoke test)
        run: |
          set -euo pipefail
          ARCH="${{ matrix.arch }}"
          STAGE="oxide-player-${ARCH}"
          rm -rf "$STAGE"
          tar -xzf "${STAGE}.tar.gz"

          echo "== layout =="
          ls -R "$STAGE" | head -40

          echo "== binary present and non-empty =="
          test -s "$STAGE/bin/oxide-player"
          file "$STAGE/bin/oxide-player" || true
          # Cross-compiled arm64 binaries cannot execute on the x86_64 runner,
          # so only smoke-run --version on the matching host architecture.
          if [ "$ARCH" = "x86_64" ]; then
            echo "== binary --version exits 0 =="
            "$STAGE/bin/oxide-player" --version
          else
            echo "== cross-arch build: skipping execute smoke test =="
          fi

          echo "== dist/index.html exists and references hashed assets =="
          test -f "$STAGE/dist/index.html"
          grep -Eq 'src="[^"]+\.(js|css)(\?[^"]*)?"' "$STAGE/dist/index.html" \
            || { echo "index.html does not reference hashed JS/CSS"; exit 1; }

          echo "== systemd unit present =="
          test -f "$STAGE/contrib/systemd/oxide-player.service"
          if command -v systemd-analyze >/dev/null 2>&1; then
            systemd-analyze verify "$STAGE/contrib/systemd/oxide-player.service" \
              && echo "systemd-analyze verify OK"
          else
            echo "systemd-analyze not available; skipping unit verify"
          fi

          echo "== install.sh is executable =="
          test -x "$STAGE/install.sh"

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: ${{ steps.pkg.outputs.asset }}
          fail_on_unmatched_files: true
