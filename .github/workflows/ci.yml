name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      # The PWA static-serving test asserts on frontend/dist artifacts, so the
      # frontend must be built before the backend tests run.
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Cache the vite build output so the backend job reuses it instead of
      # rebuilding from scratch on every run.
      - name: Cache frontend dist
        id: dist-cache
        uses: actions/cache@v5
        with:
          path: frontend/dist
          key: frontend-dist-${{ hashFiles('frontend/package-lock.json', 'frontend/vite.config.ts', 'frontend/src/**') }}
      - name: Build frontend (generates dist/ for PWA tests)
        if: steps.dist-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: |
          npm install
          npm run build
      # cpal (used by the visualizer) needs native ALSA dev headers to build.
      - name: Install ALSA dev headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Test
        run: cargo test

  frontend:
    name: Frontend build & type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm install
      - name: Build (type-check)
        run: npm run build
      - name: Test
        run: npm test

