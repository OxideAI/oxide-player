<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover"
        />
        <meta name="theme-color" content="#050507" />
        <link rel="manifest" href="/manifest.webmanifest" />
        <link rel="apple-touch-icon" href="/icon-512.png" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <meta name="apple-mobile-web-app-title" content="Oxide" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,400..600&display=swap"
            rel="stylesheet"
        />
        <title>Oxide</title>
    </head>
    <body>
        <div id="root"></div>
        <script>
            // Kill any stale service worker from a previous build (e.g. the old
            // `prompt` SW that precached a pre-visualizer bundle and never updated).
            // Runs before the app module so a stuck SW can't serve old code.
            (function () {
                try {
                    if ("serviceWorker" in navigator) {
                        navigator.serviceWorker
                            .getRegistrations()
                            .then(function (regs) {
                                regs.forEach(function (r) {
                                    r.unregister();
                                });
                            });
                    }
                } catch (e) {}
            })();
        </script>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
